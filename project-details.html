<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Project — Muhammed Afid</title>
        <meta name="theme-color" content="#0b0d16" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
        <link rel="icon" href="assests/images/profile-pic.jpeg" />
        <script>
            (function () {
                var saved = localStorage.getItem("theme");
                if (saved) document.documentElement.dataset.theme = saved;
            })();
        </script>
    </head>
    <body>
        <div class="progress-bar" id="progressBar"></div>

        <div class="aurora" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>
        <div class="grid-veil" aria-hidden="true"></div>

        <header class="nav" id="nav">
            <div class="shell nav__inner">
                <a href="index.html" class="brand">
                    <span class="brand__mark">MA</span>
                    <span>Muhammed Afid</span>
                </a>

                <div class="nav__actions">
                    <button
                        class="icon-btn theme-toggle"
                        id="themeToggle"
                        type="button"
                        aria-label="Toggle colour theme"
                    >
                        <svg
                            class="moon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                        <svg
                            class="sun"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="12" r="4" />
                            <path
                                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                            />
                        </svg>
                    </button>
                    <a href="index.html#projects" class="btn btn--ghost">
                        All projects
                    </a>
                </div>
            </div>
        </header>

        <main>
            <!-- Header -->
            <section class="detail-hero">
                <div class="shell">
                    <a href="index.html#projects" class="back-link">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M19 12H5M11 18l-6-6 6-6" />
                        </svg>
                        Back to portfolio
                    </a>

                    <span class="eyebrow" id="projectCategory"></span>
                    <h1 class="detail-title" id="projectTitle">Project</h1>
                    <p class="detail-desc" id="projectDescription"></p>
                    <div class="detail-tags" id="projectTags"></div>
                    <div class="detail-links" id="storeLinks"></div>
                </div>
            </section>

            <!-- Screenshots -->
            <section class="section" id="shotsSection" hidden>
                <div class="shell">
                    <div class="section-head reveal">
                        <span class="eyebrow">Gallery</span>
                        <h2 class="section-title">Inside the app</h2>
                    </div>
                    <div class="shots" id="screenshots"></div>
                </div>
            </section>

            <!-- Breakdown -->
            <section class="section section--tint">
                <div class="shell">
                    <div class="section-head reveal">
                        <span class="eyebrow">Under the hood</span>
                        <h2 class="section-title">How it was built</h2>
                    </div>
                    <div class="info-grid" id="infoGrid"></div>
                </div>
            </section>

            <!-- More work -->
            <section class="section">
                <div class="shell">
                    <div class="section-head reveal">
                        <span class="eyebrow">Keep exploring</span>
                        <h2 class="section-title">More projects</h2>
                    </div>
                    <div class="related" id="related"></div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="shell footer__inner">
                <p>&copy; <span id="year"></span> Muhammed Afid.</p>
                <a href="index.html#contact" class="back-link">
                    Start a project
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M5 12h14M13 6l6 6-6 6" />
                    </svg>
                </a>
            </div>
        </footer>

        <button class="to-top" id="toTop" type="button" aria-label="Back to top">
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
        </button>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot preview">
            <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Close preview">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                >
                    <path d="M18 6 6 18M6 6l12 12" />
                </svg>
            </button>
            <img id="lightboxImage" src="" alt="" />
        </div>

        <script src="project-data.js"></script>
        <script src="project-details.js"></script>
    </body>
</html>
